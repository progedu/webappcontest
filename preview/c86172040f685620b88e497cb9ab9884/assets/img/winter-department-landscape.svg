    :is(#scratch,#scratch-snow):target ~ .land { --far:#b8b192; --near:#949b77; }
    .winter:target ~ .land { --pasture:#c5d8e1; --bank:#f8fbfb; --field:#e4eef1; --furrow:#c1d4dd; --caps:inline; }
    .winter:target ~ .land .grass { display:none; }
    .snow-cap { display:var(--caps); }
    .plum { display:none; }
    :is(#unity,#unity-snow):target ~ .land .plum { display:inline; }

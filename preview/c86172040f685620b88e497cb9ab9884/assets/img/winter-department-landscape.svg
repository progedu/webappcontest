<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" preserveAspectRatio="none" fill="none">
  <style>
    .land { --far:#91adae; --near:#6c9994; --line:#547d7a; --bough:#466f66; --pasture:#8daa71; --bank:#b1c687; --field:#92b173; --furrow:#72965f; --tuft:#618157; --caps:none; }
